<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Jupiter Radiance Radial Gradient -->
    <radialGradient id="jupiterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff9c4" stop-opacity="1"/>
      <stop offset="35%" stop-color="#ffd54f" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#ffb300" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff8f00" stop-opacity="0"/>
    </radialGradient>

    <!-- Metallic Gold Gradients for Sacred Lines -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff59d"/>
      <stop offset="25%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#ffa000"/>
      <stop offset="75%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#fff176"/>
    </linearGradient>

    <linearGradient id="goldPetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffea00" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff8f00" stop-opacity="0.08"/>
    </linearGradient>

    <linearGradient id="triFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffc107" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff8f00" stop-opacity="0.15"/>
    </linearGradient>

    <linearGradient id="centerTriFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe082" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff8f00" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Divine Glow Filter -->
    <filter id="goldenAura" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- ASHTA DALA PADMA: one lotus petal, centre at origin, tip pointing up (-y),
         base at r=88, tip at r=112, replicated 8x by rotate(0,45,...,315) for perfect symmetry -->
    <g id="lotusPetal">
      <path d="M -20,-88 Q -32,-96 0,-112 Q 32,-96 20,-88 Z" fill="url(#goldPetal)" stroke="url(#goldGradient)" stroke-width="2" filter="url(#goldenAura)"/>
    </g>
  </defs>

  <!-- Deep Sacred Backdrop -->
  <rect width="512" height="512" rx="64" fill="#060907"/>

  <!-- Jupiter Cosmic Radiance Field -->
  <circle cx="256" cy="256" r="240" fill="url(#jupiterGlow)"/>

  <!-- BHUPURA (Sacred 3-Tier Earth Enclosure with 4 aligned Cardinal Gates) -->
  <!-- Tier 1: outer square 40..472 -->
  <path d="M 40,40 L 224,40 L 224,74 L 288,74 L 288,40 L 472,40 L 472,224 L 438,224 L 438,288 L 472,288 L 472,472 L 288,472 L 288,438 L 224,438 L 224,472 L 40,472 L 40,288 L 74,288 L 74,224 L 40,224 Z" fill="none" stroke="url(#goldGradient)" stroke-width="2.5" filter="url(#goldenAura)"/>
  <!-- Tier 2: square 56..456 -->
  <path d="M 56,56 L 224,56 L 224,90 L 288,90 L 288,56 L 456,56 L 456,224 L 422,224 L 422,288 L 456,288 L 456,456 L 288,456 L 288,422 L 224,422 L 224,456 L 56,456 L 56,288 L 90,288 L 90,224 L 56,224 Z" fill="none" stroke="url(#goldGradient)" stroke-width="1.5" opacity="0.8"/>
  <!-- Tier 3: square 72..440 -->
  <path d="M 72,72 L 224,72 L 224,106 L 288,106 L 288,72 L 440,72 L 440,224 L 406,224 L 406,288 L 440,288 L 440,440 L 288,440 L 288,406 L 224,406 L 224,440 L 72,440 L 72,288 L 106,288 L 106,224 L 72,224 Z" fill="none" stroke="url(#goldGradient)" stroke-width="1.8" opacity="0.9"/>

  <!-- TRILOKYA (Three Concentric Circles - the Three Worlds): r=170, 145, 120 -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#goldGradient)" stroke-width="2.5" filter="url(#goldenAura)"/>
  <circle cx="256" cy="256" r="145" fill="none" stroke="url(#goldGradient)" stroke-width="1.5" opacity="0.8"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="url(#goldGradient)" stroke-width="2" opacity="0.85"/>

  <!-- ASHTA DALA PADMA (Eightfold Lotus): 8 perfectly symmetrical petals at 45deg, r=88..112 -->
  <g id="lotusPetals">
    <use href="#lotusPetal" transform="translate(256,256) rotate(0)"/>
    <use href="#lotusPetal" transform="translate(256,256) rotate(45)"/>
    <use href="#lotusPetal" transform="translate(256,256) rotate(90)"/>
    <use href="#lotusPetal" transform="translate(256,256) rotate(135)"/>
    <use href="#lotusPetal" transform="translate(256,256) rotate(180)"/>
    <use href="#lotusPetal" transform="translate(256,256) rotate(225)"/>
    <use href="#lotusPetal" transform="translate(256,256) rotate(270)"/>
    <use href="#lotusPetal" transform="translate(256,256) rotate(315)"/>
  </g>

  <!-- SHATKONA (Interlocking Upward Shiva & Downward Shakti Equilateral Triangles, shared centroid 256,256, circumradius 80) -->
  <polygon points="256,176 186.72,296 325.28,296" fill="url(#triFill)" stroke="url(#goldGradient)" stroke-width="3.2" filter="url(#goldenAura)"/>
  <polygon points="256,336 186.72,216 325.28,216" fill="url(#triFill)" stroke="url(#goldGradient)" stroke-width="3.2" filter="url(#goldenAura)"/>

  <!-- CENTRAL DOWNWARD TRIKONA (Tara Shakti Triangle), equilateral, centroid 256,256, circumradius 38 -->
  <polygon points="256,294 223.09,237 288.91,237" fill="url(#centerTriFill)" stroke="#fff59d" stroke-width="3" filter="url(#goldenAura)"/>

  <!-- SUPREME BINDU (Tara Consciousness Point) -->
  <circle cx="256" cy="256" r="10" fill="#ffb300" opacity="0.35"/>
  <circle cx="256" cy="256" r="6" fill="#ffd54f" opacity="0.7"/>
  <circle cx="256" cy="256" r="3" fill="#ffffff" stroke="#ffb300" stroke-width="1.5" filter="url(#goldenAura)"/>
</svg>