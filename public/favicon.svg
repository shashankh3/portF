<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Jupiter Radiance Radial Gradient -->
    <radialGradient id="jupiterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff9c4" stop-opacity="1"/>
      <stop offset="35%" stop-color="#ffd54f" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#ffb300" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff8f00" stop-opacity="0"/>
    </radialGradient>

    <!-- Metallic Gold Gradients for Sacred Lines -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff59d"/>
      <stop offset="25%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#ffa000"/>
      <stop offset="75%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#fff176"/>
    </linearGradient>

    <linearGradient id="goldPetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffea00" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff8f00" stop-opacity="0.08"/>
    </linearGradient>

    <linearGradient id="triFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffc107" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff8f00" stop-opacity="0.15"/>
    </linearGradient>

    <linearGradient id="centerTriFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe082" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff8f00" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Divine Glow Filter -->
    <filter id="goldenAura" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Sacred Backdrop -->
  <rect width="512" height="512" rx="64" fill="#060907"/>
  
  <!-- Jupiter Cosmic Radiance Field -->
  <circle cx="256" cy="256" r="240" fill="url(#jupiterGlow)"/>

  <!-- BHUPURA (Sacred 3-Tier Earth Enclosure with 4 Portals) -->
  <path d="M 40 40 L 208 40 L 208 24 L 304 24 L 304 40 L 472 40 L 472 208 L 488 208 L 488 304 L 472 304 L 472 472 L 304 472 L 304 488 L 208 488 L 208 472 L 40 472 L 40 304 L 24 304 L 24 208 L 40 208 Z" fill="none" stroke="url(#goldGradient)" stroke-width="3" filter="url(#goldenAura)"/>
  <path d="M 48 48 L 208 48 L 208 34 L 304 34 L 304 48 L 464 48 L 464 208 L 478 208 L 478 304 L 464 304 L 464 464 L 304 464 L 304 478 L 208 478 L 208 464 L 48 464 L 48 304 L 34 304 L 34 208 L 48 208 Z" fill="none" stroke="url(#goldGradient)" stroke-width="1.8" opacity="0.85"/>
  <path d="M 56 56 L 208 56 L 208 44 L 304 44 L 304 56 L 456 56 L 456 208 L 468 208 L 468 304 L 456 304 L 456 456 L 304 456 L 304 468 L 208 468 L 208 456 L 56 456 L 56 304 L 44 304 L 44 208 L 56 208 Z" fill="none" stroke="url(#goldGradient)" stroke-width="2.2" opacity="0.95"/>

  <!-- OUTER CONCENTRIC CIRCLES (Trivritta) -->
  <circle cx="256" cy="256" r="186" fill="none" stroke="url(#goldGradient)" stroke-width="2.5" filter="url(#goldenAura)"/>
  <circle cx="256" cy="256" r="178" fill="none" stroke="url(#goldGradient)" stroke-width="1.5" opacity="0.8"/>

  <!-- ASHTA DALA PADMA (8 LOTUS PETALS) -->
  <g id="lotusPetals">
    <path d="M 210.84 146.98 Q 225.13 100.80 256.00 84.00 Q 286.87 100.80 301.16 146.98 Z" fill="url(#goldPetal)" stroke="url(#goldGradient)" stroke-width="2.2" filter="url(#goldenAura)"/>
    <path d="M 256.00 138.00 L 256.00 84.00" fill="none" stroke="url(#goldGradient)" stroke-width="1.2" opacity="0.75"/>
    <path d="M 301.16 146.98 Q 343.91 124.43 377.62 134.38 Q 387.57 168.09 365.02 210.84 Z" fill="url(#goldPetal)" stroke="url(#goldGradient)" stroke-width="2.2" filter="url(#goldenAura)"/>
    <path d="M 339.44 172.56 L 377.62 134.38" fill="none" stroke="url(#goldGradient)" stroke-width="1.2" opacity="0.75"/>
    <path d="M 365.02 210.84 Q 411.20 225.13 428.00 256.00 Q 411.20 286.87 365.02 301.16 Z" fill="url(#goldPetal)" stroke="url(#goldGradient)" stroke-width="2.2" filter="url(#goldenAura)"/>
    <path d="M 374.00 256.00 L 428.00 256.00" fill="none" stroke="url(#goldGradient)" stroke-width="1.2" opacity="0.75"/>
    <path d="M 365.02 301.16 Q 387.57 343.91 377.62 377.62 Q 343.91 387.57 301.16 365.02 Z" fill="url(#goldPetal)" stroke="url(#goldGradient)" stroke-width="2.2" filter="url(#goldenAura)"/>
    <path d="M 339.44 339.44 L 377.62 377.62" fill="none" stroke="url(#goldGradient)" stroke-width="1.2" opacity="0.75"/>
    <path d="M 301.16 365.02 Q 286.87 411.20 256.00 428.00 Q 225.13 411.20 210.84 365.02 Z" fill="url(#goldPetal)" stroke="url(#goldGradient)" stroke-width="2.2" filter="url(#goldenAura)"/>
    <path d="M 256.00 374.00 L 256.00 428.00" fill="none" stroke="url(#goldGradient)" stroke-width="1.2" opacity="0.75"/>
    <path d="M 210.84 365.02 Q 168.09 387.57 134.38 377.62 Q 124.43 343.91 146.98 301.16 Z" fill="url(#goldPetal)" stroke="url(#goldGradient)" stroke-width="2.2" filter="url(#goldenAura)"/>
    <path d="M 172.56 339.44 L 134.38 377.62" fill="none" stroke="url(#goldGradient)" stroke-width="1.2" opacity="0.75"/>
    <path d="M 146.98 301.16 Q 100.80 286.87 84.00 256.00 Q 100.80 225.13 146.98 210.84 Z" fill="url(#goldPetal)" stroke="url(#goldGradient)" stroke-width="2.2" filter="url(#goldenAura)"/>
    <path d="M 138.00 256.00 L 84.00 256.00" fill="none" stroke="url(#goldGradient)" stroke-width="1.2" opacity="0.75"/>
    <path d="M 146.98 210.84 Q 124.43 168.09 134.38 134.38 Q 168.09 124.43 210.84 146.98 Z" fill="url(#goldPetal)" stroke="url(#goldGradient)" stroke-width="2.2" filter="url(#goldenAura)"/>
    <path d="M 172.56 172.56 L 134.38 134.38" fill="none" stroke="url(#goldGradient)" stroke-width="1.2" opacity="0.75"/>
  </g>

  <!-- INNER CONCENTRIC CIRCLES -->
  <circle cx="256" cy="256" r="112" fill="none" stroke="url(#goldGradient)" stroke-width="1.8" opacity="0.85"/>
  <circle cx="256" cy="256" r="106" fill="none" stroke="url(#goldGradient)" stroke-width="2.4" filter="url(#goldenAura)"/>

  <!-- SHATKONA (INTERLOCKING UPWARD SHIVA & DOWNWARD SHAKTI TRIANGLES) -->
  <polygon points="256.00,160.00 339.14,304.00 172.86,304.00" fill="url(#triFill)" stroke="url(#goldGradient)" stroke-width="3.2" filter="url(#goldenAura)"/>
  <polygon points="256.00,352.00 339.14,208.00 172.86,208.00" fill="url(#triFill)" stroke="url(#goldGradient)" stroke-width="3.2" filter="url(#goldenAura)"/>

  <!-- CENTRAL DOWNWARD TRIANGLE (TARA SHAKTI TRIKONA) -->
  <polygon points="256.00,300.00 294.11,234.00 217.89,234.00" fill="url(#centerTriFill)" stroke="#fff59d" stroke-width="3" filter="url(#goldenAura)"/>

  <!-- SUPREME BINDU (TARA CONSCIOUSNESS POINT) -->
  <circle cx="256" cy="256" r="12" fill="#ffb300" opacity="0.35"/>
  <circle cx="256" cy="256" r="8" fill="#ffd54f" opacity="0.7"/>
  <circle cx="256" cy="256" r="6" fill="#ffffff" stroke="#ffb300" stroke-width="1.5" filter="url(#goldenAura)"/>
</svg>